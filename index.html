{k:'amr',t:'Intelligent Mobile Robot (AMR) for Adaptive Factory Navigation',s:'Ongoing · Project Lead · 2025 to present',o:'Autonomous material transport with hybrid SLAM and marker navigation, vision-guided pickup and a height-adjustable conveyor.',r:'Leading a ROS2/Nav2 stack (global and local planner) that combines LiDAR SLAM occupancy mapping with ArUco marker localization at key waypoints. Building a multi-sensor perception stack (LiDAR, camera, IMU, ultrasonic) with PID-tuned control on a custom differential-drive platform. Designed conveyor material transfer with rack-and-pinion height adjustment.',a:'ROS2, Nav2, SLAM, Gazebo, RViz, Raspberry Pi 4, YDLIDAR X2, Logitech C270, MQTT',m:'No performance metrics are documented yet. Validation across ROS2, Gazebo, RViz and hardware is in progress.'},
{k:'uav',t:'Autonomous UAV Navigation (IIT Bombay)',s:'Completed · Research Intern · Dec 2024 to Jan 2025',o:'Reliable navigation for a UAV in GPS-denied environments.',r:'Architected a multi-sensor fusion stack (LiDAR, optical flow, GPS) on Cube Orange+ (ArduPilot/PX4) with EKF source switching. Tuned PID controllers for hover, position hold and waypoint transitions, validated with calibration cycles and flight logs in Mission Planner.',a:'ArduPilot, PX4, EKF, Mission Planner, LiDAR, optical flow',m:'Positional drift reduced to about 2 to 3 m in GPS-degraded conditions, a 60%+ improvement over the GPS-only baseline.'},
{k:'scip',t:'SCIP: Space Sustainability & Collision Intelligence Platform',s:'Project Lead · Aerospace Minor · 2026',o:'Pre-mission satellite evaluation using live orbital data.',r:'Designed a dual-module ML framework over 13,800+ CelesTrak TLE objects with SGP4 propagation. Built the SSR scoring engine (conjunctions, debris proximity, orbital lifecycle) and an interactive visualization frontend for mission planners.',a:'Python, SGP4, CelesTrak TLE, ML, web visualization',m:'Computes per-satellite collision risk and Space Sustainability Ratings (0 to 100, Gold/Silver/Basic) at scale. No accuracy metric is documented.'},
{k:'abhay',t:'ABHAY: Assistive Hand Exoskeleton',s:'Prototype · Embedded Systems Lead · 2025',o:'Physiotherapy exoskeleton driven by flex sensor motion capture.',r:'Built flex sensor acquisition and closed-loop motor control on ESP32. Designed actuation constraints and safe-range enforcement in firmware to prevent over-extension during prototype validation.',a:'ESP32, flex sensors, closed-loop motor control, firmware',m:'Under 5 ms end-to-end response latency.'},
{k:'med',t:'Medura: AI Wearable Healthcare Monitor',s:'Hackathon Winner · Periscope Digital Healthcare Hackathon · 2025',o:'Elderly care wearable with real-time anomaly detection and caregiver alerts.',r:'Developed the ESP32 health monitoring pipeline with a real-time Random Forest fall-detection model.',a:'ESP32, Random Forest, mobile application',m:'Won the Best Team Efforts award. No model accuracy is documented.'},
